application:
  name: slim-lake-hadoop
  pods:
    - name: namenode
      image: "# filled by pipeline"
      servicePorts:
        - 9000
        - 9864
      vars:
        HADOOP_ROLE: "namenode"
    - name: datanode
      image: "# filled by pipeline"
      servicePorts:
        - 9864
      vars:
        HADOOP_ROLE: "datanode"
    - name: resourcemanager
      image: "# filled by pipeline"
      servicePorts:
        - 8088
        - 8032
      vars:
        HADOOP_ROLE: "resourcemanager"
    - name: nodemanager
      image: "# filled by pipeline"
      servicePorts:
        - 8042
      vars:
        HADOOP_ROLE: "nodemanager"